<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <main>
      {% include header.html %}
      <section class="article">
        <div class="article-header">
          <h2 class="article-title">{{page.title}}</h2>
          <small class="date">{{page.date | date_to_string}}</small>
          <div class="tags">
            {% for c in page.tags %}
            <a href="#!" class="tag">{{c | downcase}}</a>
            {% endfor %}
          </div>
        </div>
        <div class="content">{{content}}</div>
      </section>
      {% include gpgc-comments.html post_title=page.title %}
      {% include footer.html %}
    </main>
    {% include tag-modal.html%}
  </body>
</html>
