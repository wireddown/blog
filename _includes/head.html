<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{page.title}} | {{site.title}}</title>
  <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/favicon.png">
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/open-color.css" />
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/common.css" />
  {% if page.layout == "default" %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/default.css" />
  {% elsif page.layout == "post" %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/post.css" />
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/syntax.css" />
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/gpgc-styles.css" />
  {% else %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/blog.css" />
  {% endif %}
  <script src="{{site.baseurl}}/assets/js/tags.js"></script>
</head>
